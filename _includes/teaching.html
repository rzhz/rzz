<section id="teaching" class="section-grid" aria-labelledby="teaching-heading">
    <div class="section-heading"><h2 id="teaching-heading">Teaching</h2></div>
    <div class="section-body">
        {% for course in site.data.teaching %}
        <article class="course"><span class="course-code">{{ course.code }}</span><div><h3>{{ course.title }}</h3><p>{{ course.term }}</p></div></article>
        {% endfor %}
    </div>
</section>
