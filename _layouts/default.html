<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="author" content="{{ site.author | escape }}">
    <meta name="theme-color" content="#faf9f6">
    <title>{{ site.title | escape }} · Marketing Research</title>
    <link rel="icon" href="{{ '/assets/img/icon.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    {% if jekyll.environment == 'production' %}
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1CVTQX5B0Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1CVTQX5B0Z');
    </script>
    {% endif %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include navbar.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
</body>
</html>
